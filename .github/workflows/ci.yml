name: CI

on:
  pull_request:
    branches:
      - main
      - stable
      - "release/**"
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint source code
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Apply migrations to a clean database
        run: npm run verify:clean-migrations

      - name: Build production application without a SQLite file
        run: npm run verify:build-without-database

      - name: Scan repository for secrets
        run: npm run security:secrets

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build production application without a SQLite file
        run: npm run verify:build-without-database

      - name: Run Playwright against an isolated database
        run: npm run test:e2e
