# Private single-instance deployment.
#
# One application container and one durable volume for the personal database.
# The port is published on the host loopback address only: remote access is
# granted by the private VPN or a local reverse proxy, never by this file.

name: personal-finance-tracker

services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    image: personal-finance-tracker:${APP_IMAGE_TAG:-local}
    # Credentials and private configuration live in .env on the host, outside
    # the repository and outside every image layer.
    env_file:
      - .env
    environment:
      # The fixed container path wins over the local development value in .env
      # so personal data always lands on its durable volume.
      DATABASE_PATH: /data/personal/personal-finance.db
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOW_NON_LOOPBACK_BIND: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - personal-data:/data/personal
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  personal-data:
